name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend and connector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  example-client:
    name: Type-check connectors against the PowerSync SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: example-client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: example-client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  supabase:
    name: Supabase Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local Supabase
        working-directory: backend
        run: supabase start

      - name: Serve functions
        working-directory: backend
        run: |
          supabase functions serve > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Serving functions" "$RUNNER_TEMP/functions.log" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1

      - name: Run tests
        working-directory: backend/supabase/functions/powersync-write
        run: deno task test
